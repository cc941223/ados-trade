version: "3.9"

services:
  # IBKR Gateway（TWS API 协议，ib_insync 通过 4002 端口连接）
  # ⚠️ 从 IBeam + Client Portal Web API（CPAPI）换成这个方案之后，
  # 首次登录/2FA 需要通过 VNC（5900 端口）连进容器桌面手动确认，
  # 跟 IBeam 时代"手机 IB Key 推送确认"的流程不一样。
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ados-ibgateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${IBKR_USERID}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: paper
      READ_ONLY_API: no
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD}
    ports:
      - "4002:4002"
      - "5900:5900"

  # IB Gateway 连接监控 + 断线告警。TWS API 是长连接 socket 协议，不需要
  # 像 CPAPI 那样定时 tickle 保活，这个脚本靠 ib_insync 的连接状态事件
  # （connectedEvent/disconnectedEvent）监听断线，断线立刻通过 Server酱
  # 推送微信告警，另外每 HEARTBEAT_INTERVAL（默认 60s）兜底检查一次
  # ib.isConnected()，防止事件本身漏报。详细设计见 scripts/keepalive.py
  # 顶部文档。
  keepalive:
    image: python:3.11-slim
    container_name: ados-keepalive
    restart: unless-stopped
    env_file:
      - env.list
    environment:
      IBGATEWAY_HOST: ibgateway
      IBGATEWAY_PORT: "4002"
    depends_on:
      - ibgateway
    volumes:
      - ./scripts:/scripts:ro
    # ⚠️ keepalive.py 现在依赖 ib_insync（原来只用标准库），
    # python:3.11-slim 这个基础镜像没有预装，用 sh -c 在启动时先装一下
    # 再跑脚本——这是本次改造顺带补的最小化处理，如果以后依赖变多，
    # 应该换成专门的 Dockerfile 固化镜像，而不是每次启动都重新装一遍。
    command: ["sh", "-c", "pip install --quiet ib_insync && python3 /scripts/keepalive.py"]

  # 时间序列数据库
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ados-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ados
      POSTGRES_PASSWORD: changeme_in_env
      POSTGRES_DB: ados_trade
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # 实时缓存
  redis:
    image: redis:7-alpine
    container_name: ados-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  timescale-data:
  redis-data:
