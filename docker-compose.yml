version: "3.9"

services:
  # IBKR Gateway（TWS API 协议，ib_insync 通过 4002 端口连接）
  # ⚠️ 从 IBeam + Client Portal Web API（CPAPI）换成这个方案之后，
  # 首次登录/2FA 需要通过 VNC（5900 端口）连进容器桌面手动确认，
  # 跟 IBeam 时代"手机 IB Key 推送确认"的流程不一样。
  ibgateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    container_name: ados-ibgateway
    restart: unless-stopped
    environment:
      TWS_USERID: ${IBKR_USERID}
      TWS_PASSWORD: ${IBKR_PASSWORD}
      TRADING_MODE: paper
      READ_ONLY_API: no
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD}
    ports:
      - "4002:4002"
      - "5900:5900"

  # ⚠️ IBKR Gateway 保活 + 掉线告警脚本——这是 IBeam/CPAPI 时代的实现
  # （靠 HTTPS 调用 /v1/api/tickle + /v1/api/iserver/auth/status 保活），
  # 换成 ib_insync + TWS API（socket 协议）之后这套 HTTP 轮询逻辑已经不
  # 适用（`ibgateway` 服务没有对外暴露 CPAPI 的 HTTPS 端口），这个服务
  # 暂时保留定义（`depends_on` 已经指到新服务名，保证 `docker compose
  # config` 能跑通），但 `scripts/keepalive.py` 内部逻辑还是旧的，实际
  # 跑起来会一直请求失败——这部分需要你确认新方案下"保活/掉线告警"具体
  # 要做成什么样（TWS API 是否还需要单独轮询，还是 ib_insync 自己的连接
  # 状态回调就够），我没有替你决定，先把这个已知不一致的地方标注出来。
  keepalive:
    image: python:3.11-slim
    container_name: ados-keepalive
    restart: unless-stopped
    env_file:
      - env.list
    environment:
      IBKR_GATEWAY_URL: https://ibgateway:5000
    depends_on:
      - ibgateway
    volumes:
      - ./scripts:/scripts:ro
    command: ["python3", "/scripts/keepalive.py"]

  # 时间序列数据库
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: ados-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ados
      POSTGRES_PASSWORD: changeme_in_env
      POSTGRES_DB: ados_trade
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data

  # 实时缓存
  redis:
    image: redis:7-alpine
    container_name: ados-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  timescale-data:
  redis-data:
